# Render Blueprint: Dashboard -> New -> Blueprint -> this repository.
# Free plan: one web service, no worker (documents are read in background threads of the web process),
# no persistent disk (receipts go to Supabase Storage), sleeps after 15 min without traffic.
services:
  - type: web
    name: receiptflow-api
    runtime: python
    plan: free
    region: ohio            # same region as the Supabase database (us-east-2)
    branch: main
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput
    # Free instances have no pre-deploy step, so migrations run at start (they are idempotent).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py seed_categories &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-2} --threads 4 --timeout 180 --access-logfile -
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,api.receiptflow.online
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DOCUMENT_BACKGROUND_THREADS
        value: "true"
      - key: EMAIL_SEND_IN_BACKGROUND
        value: "true"
      # --- Database (Supabase, Session pooler) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_POOL_MIN_SIZE
        value: "2"
      - key: DB_POOL_MAX_SIZE
        value: "4"            # x2 workers = 8 connections, within Supabase's free pooler
      # --- Uploaded receipts (Supabase Storage, S3 API) ---
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET_NAME
        value: receipts
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-2
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # --- AI ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: OCR_SERVICE
        value: gemini
      # --- Frontend (Vercel) ---
      - key: APP_FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Email (Render free blocks SMTP; with BREVO_API_KEY set, mail goes through the Brevo API) ---
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "True"
      # --- Daily tasks called by cron-job.org ---
      - key: CRON_SECRET
        generateValue: true
